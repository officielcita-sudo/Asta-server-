# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: mourchid-security
    runtime: node
    plan: free
    branch: claude/bold-gates-powzbt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: MAIL_FROM
        value: Mourchid Security <verify@granex-legal.eu>
      - key: RESEND_API_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: CONTACT_EMAIL
        value: astamed20@gmail.com
